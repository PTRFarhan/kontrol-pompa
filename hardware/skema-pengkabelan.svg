<text x="850" y="499" text-anchor="end" font-size="12" fill="#444" font-weight="700">GND</text>
<text x="970" y="538" text-anchor="middle" font-size="11" fill="#555" font-weight="400">merah=VCC, cokelat=GND</text>
<rect x="40" y="580" width="1020" height="170" rx="10" fill="#f7f9fb" stroke="#c9d6e0"/>
<text x="60" y="606" text-anchor="start" font-size="14" fill="#0b2233" font-weight="700">Catatan penting</text>
<text x="60" y="630" text-anchor="start" font-size="12" fill="#333" font-weight="400">• Semua VCC (LCD, relay, 2 sensor) ke pin VIN 5V NodeMCU. Semua GND disatukan ke pin GND NodeMCU.</text>
<text x="60" y="650" text-anchor="start" font-size="12" fill="#333" font-weight="400">• ECHO sensor mengeluarkan 5V, sedangkan pin ESP8266 hanya tahan 3,3V. Pembagi tegangan 1k seri dan 2k ke GND dianjurkan agar pin tidak rusak.</text>
<text x="60" y="670" text-anchor="start" font-size="12" fill="#333" font-weight="400">• D4 (GPIO2) harus HIGH saat boot, jadi dipakai untuk relay yang aktif LOW (mati saat HIGH). D8 (GPIO15) harus LOW saat boot, dan ECHO sensor normalnya LOW.</text>
<text x="60" y="690" text-anchor="start" font-size="12" fill="#333" font-weight="400">• Saklar manual ke 3V3 (bukan GND). Saklar ON langsung menyalakan pompa 20 menit, saklar OFF langsung mematikan.</text>
<text x="60" y="710" text-anchor="start" font-size="12" fill="#333" font-weight="400">• Kabel sensor 15 meter: pasang kapasitor 100 uF dan 0,1 uF antara VCC dan GND di dekat sensor, dan jauhkan dari kabel AC.</text>
<text x="60" y="730" text-anchor="start" font-size="12" fill="#333" font-weight="400">• Bagian pompa memakai tegangan tinggi (jika AC). Hanya kontak relay yang menyentuh jalur pompa. Pasang dengan aman dan terisolasi.</text>
</svg>
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ptrfarhan.kontrolpompa'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ptrfarhan.kontrolpompa'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        // Kunci tanda tangan tetap supaya pembaruan aplikasi bisa dipasang di atas versi lama.
        // Bila rahasia GitHub (KEYSTORE_*) diisi, kunci milikmu yang dipakai. Bila tidak, kunci bawaan di folder app.
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'kunci-bawaan.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'kontrolpompa'
            keyAlias System.getenv('KEY_ALIAS') ?: 'kontrolpompa'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'kontrolpompa'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
